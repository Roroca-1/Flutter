name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (for example v1.8.0-plus.2)
        required: true
        type: string
      publish:
        description: Publish a public GitHub Release after all builds pass
        required: true
        default: false
        type: boolean

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

concurrency:
  group: release-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HAS_ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true
      - name: Configure Android signing
        if: env.HAS_ANDROID_KEYSTORE == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build Android ARM64 release APK
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi
      - name: Collect Android artifact
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            "dist/LightNovelShelfPlus-${RELEASE_TAG}-arm64-v8a.apk"
      - uses: actions/upload-artifact@v5
        with:
          name: release-${{ env.RELEASE_TAG }}-android
          path: dist/*
          retention-days: 30

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux build dependencies
        run: >
          sudo apt-get update && sudo apt-get install -y
          clang cmake ninja-build pkg-config libgtk-3-dev
          liblzma-dev libsecret-1-dev libfuse2 wget
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Package Linux AppImage
        run: |
          mkdir -p dist
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
          cp -a build/linux/x64/release/bundle/. AppDir/usr/bin/
          cp assets/icon/app_icon.png AppDir/usr/share/icons/hicolor/256x256/apps/lightnovel-shelf-plus.png
          cat > AppDir/usr/share/applications/lightnovel-shelf-plus.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=轻书架Plus
          Exec=lightnovel_shelf_plus
          Icon=lightnovel-shelf-plus
          Categories=Office;Viewer;
          EOF
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          ARCH=x86_64 ./linuxdeploy-x86_64.AppImage --appimage-extract-and-run \
            --appdir AppDir \
            --desktop-file AppDir/usr/share/applications/lightnovel-shelf-plus.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/256x256/apps/lightnovel-shelf-plus.png \
            --executable AppDir/usr/bin/lightnovel_shelf_plus \
            --output appimage
          generated="$(find . -maxdepth 1 -type f -name '*.AppImage' ! -name 'linuxdeploy-*' -print -quit)"
          test -n "$generated"
          mv "$generated" "dist/LightNovelShelfPlus-${RELEASE_TAG}-x86_64.AppImage"
      - uses: actions/upload-artifact@v5
        with:
          name: release-${{ env.RELEASE_TAG }}-linux
          path: dist/*
          retention-days: 30

  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Package Windows bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive `
            -Path 'build/windows/x64/runner/Release/*' `
            -DestinationPath "dist/LightNovelShelfPlus-$env:RELEASE_TAG-x86_64.zip"
      - uses: actions/upload-artifact@v5
        with:
          name: release-${{ env.RELEASE_TAG }}-windows
          path: dist/*
          retention-days: 30

  publish:
    if: github.event_name != 'workflow_dispatch' || inputs.publish
    needs: [android, linux, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: release-${{ env.RELEASE_TAG }}-*
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
