name: Publish Android ARM64 release

on:
  push:
    branches:
      - feat/library-series-multi-select

permissions:
  contents: write

concurrency:
  group: android-arm64-public-release
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      RELEASE_TAG: v1.8.0-shelf.1
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true

      - name: Configure optional Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] \
            || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "No release keystore configured; using the repository's debug-signing fallback."
            exit 0
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Build Android ARM64 APK
        run: >
          flutter build apk
          --release
          --target-platform android-arm64
          --split-per-abi

      - name: Rename APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            dist/LightNovelShelf-v1.8.0-shelf.1-arm64-v8a.apk

      - uses: actions/upload-artifact@v5
        with:
          name: LightNovelShelf-v1.8.0-shelf.1-arm64-v8a
          path: dist/LightNovelShelf-v1.8.0-shelf.1-arm64-v8a.apk
          retention-days: 30

      - name: Publish public GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: LightNovelShelf 1.8.0 Shelf Edition 1
          body: |
            Android ARMv8-A release based on upstream LightNovelShelf 1.8.0.

            Includes series grouping and multi-selection on discovery and shelf pages,
            plus view-only shelf sorting by pinyin/romaji, update time, and added time.
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          files: dist/LightNovelShelf-v1.8.0-shelf.1-arm64-v8a.apk
